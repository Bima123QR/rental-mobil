<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin – Jember Sport Car Rental</title>
<style>
:root{
  --bg:#141414; --side:#0c0c0c; --card:#1c1c1c; --card2:#262626; --line:#333;
  --ink:#f2f2f2; --muted:#9a9a9a; --accent:#ff5a1f; --accent2:#ff8a3d; --r:16px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.4}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card2);color:var(--ink);padding:8px 13px;border-radius:10px}
button:hover{filter:brightness(1.15)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.primary{background:linear-gradient(180deg,#ff6a2c,#ff4a12);border-color:#ff7a45;color:#fff;font-weight:600}
.danger{color:#ff7b72}
input,select{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card2);color:var(--ink);width:100%}
a{color:var(--accent2)}
label{font-size:.82rem;color:var(--muted);display:block;margin-bottom:4px}
.hide{display:none!important}
#err{color:#ff7b72;margin-top:8px}

.panel{background:linear-gradient(180deg,#242424,#1a1a1a);border:1px solid #2e2e2e;border-radius:var(--r);padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}

/* Shell */
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--side);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600}
.brandimg{display:block;width:100%;max-width:200px;height:auto;mix-blend-mode:lighten}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#ff7a2f,#ff4510);display:grid;place-items:center;font-weight:700}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:1px solid transparent;color:#cfcfcf;padding:10px 12px;border-radius:12px}
.nav button:hover{background:#1a1a1a;filter:none}
.nav button[aria-selected=true]{background:linear-gradient(180deg,#333,#222);border-color:#444;color:#fff}
.badge{margin-left:auto;background:#fff;color:#111;border-radius:99px;font-size:11px;font-weight:600;min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px}
.side .push{margin-top:auto}

.main{min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:14px 24px;background:#0c0c0c;border-bottom:1px solid #000}
.top .crumb{margin-right:auto;color:var(--muted)}
.top .crumb b{color:var(--ink);font-weight:400}
.content{padding:24px}
.head{margin-bottom:18px}
.head h1{margin:0 0 2px;font-size:22px;font-weight:500}
.head p{margin:0;color:var(--muted)}

/* Stat cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:16px}
.stat{border-radius:var(--r);padding:18px;background:linear-gradient(180deg,#2a2a2a,#1c1c1c);border:1px solid #2e2e2e}
.stat small{color:var(--muted)}
.stat .v{font-size:26px;font-weight:500;margin-top:14px}
.stat.hero{background:linear-gradient(160deg,#ff6a2c,#ff3d00);border-color:#ff7a45}
.stat.hero small{color:rgba(255,255,255,.85)}

/* Chart */
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.ph h2{margin:0;font-size:16px;font-weight:500}
.big{font-size:26px;font-weight:500}
.plot{position:relative;height:220px;display:flex;align-items:flex-end;gap:12px;padding-bottom:26px;margin-top:10px}
.col{flex:1;height:100%;display:flex;align-items:flex-end;position:relative;cursor:pointer}
.bar{width:100%;min-height:4px;border-radius:8px;background:linear-gradient(180deg,#3d3d3d,#262626)}
.col.on .bar{background:linear-gradient(180deg,#ff5a1f,#ff7a45 55%,#fff)}
.col .lb{position:absolute;bottom:-24px;left:0;right:0;text-align:center;color:var(--muted);font-size:12px}
.tip{position:absolute;top:0;left:calc(100% + 6px);z-index:3;background:#2a2a2a;border:1px solid #444;border-radius:10px;padding:8px 12px;font-size:12px;min-width:150px;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.col:last-child .tip,.col:nth-last-child(2) .tip{left:auto;right:calc(100% + 6px)}
.tip div{display:flex;justify-content:space-between;gap:12px}
.tip .h{color:var(--muted);margin-bottom:3px}

/* Table */
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar2 h2{margin:0 auto 0 0;font-size:16px;font-weight:500}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{background:#2a2a2a;color:var(--muted);font-weight:400;padding:11px 12px;text-align:left;white-space:nowrap}
th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}
td{padding:12px;border-bottom:1px solid #2c2c2c;text-align:left;white-space:nowrap}
tr:last-child td{border-bottom:0}
td select{width:auto;padding:6px 8px}

@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px}
  .nav{flex-direction:row}
  .side .push{margin:0}
  .top{padding:12px 14px}.content{padding:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

            <div><label>Kategori</label><input id="cCat" placeholder="City car"></div>
            <div><label>Kursi</label><input id="cSeats" type="number" min="1"></div>
            <div><label>Transmisi</label><select id="cTrans"><option>Manual</option><option>Otomatis</option></select></div>
            <div><label>BBM</label><select id="cFuel"><option>Bensin</option><option>Diesel</option><option>Listrik</option></select></div>
            <div><label>Harga / hari</label><input id="cPrice" type="number" min="1"></div>
            <div><label>URL foto (opsional)</label><input id="cImg" placeholder="https://..."></div>
            <div><label>Biaya sopir / hari</label><input id="cDriver" type="number" min="0" value="200000"></div>
          </div>
          <button class="primary" id="saveCar">Simpan mobil</button>
          <button id="cancelEdit" class="hide">Batal ubah</button>
        </div>
        <div class="panel"><div class="tablewrap"><table id="tC"></table></div></div>
      </section>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const rp = n => 'Rp ' + Number(n).toLocaleString('id-ID');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST = {pending:'Menunggu',confirmed:'Dikonfirmasi',done:'Selesai',cancelled:'Dibatalkan'};
const BLN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
let key = sessionStorage.getItem('adminKey') || '', bookings = [], cars = [], editId = null;

async function api(url, method = 'GET', body) {
  const r = await fetch(url, {method, headers: {'Content-Type':'application/json','x-admin-key':key}, body: body && JSON.stringify(body)});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Gagal.');
  return d;
}
async function enter() {
  try { await load(); $('login').classList.add('hide'); $('app').classList.remove('hide'); sessionStorage.setItem('adminKey', key); }
  catch (e) { $('err').textContent = e.message; key = ''; sessionStorage.removeItem('adminKey'); }
}
async function load() { [bookings, cars] = await Promise.all([api('/api/admin/bookings'), api('/api/admin/cars')]); renderStats(); renderChart(); renderB(); renderC(); }

/* Ringkasan + grafik (dihitung dari data pesanan yang sudah ada) */
function renderStats() {
  const valid = bookings.filter(b => b.status !== 'cancelled');
  $('sRev').textContent = rp(valid.reduce((a, b) => a + Number(b.total_price || 0), 0));
  const pend = bookings.filter(b => b.status === 'pending').length;
  $('sPend').textContent = pend; $('badgeB').textContent = pend;
  const act = cars.filter(c => c.is_active).length;
  $('sCars').textContent = act + ' / ' + cars.length; $('badgeC').textContent = cars.length;
}
let chartSel = null, chartData = [];
function renderChart() {
  const now = new Date(), months = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push({key: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'), label: BLN[d.getMonth()], year: d.getFullYear(), sum: 0, n: 0}); }
  bookings.filter(b => b.status !== 'cancelled').forEach(b => { const m = months.find(x => x.key === String(b.start_date).slice(0, 7)); if (m) { m.sum += Number(b.total_price || 0); m.n++; } });
  chartData = months;
  $('chartTotal').textContent = rp(months.reduce((a, m) => a + m.sum, 0));
  const max = Math.max(...months.map(m => m.sum), 1);
  if (chartSel === null) chartSel = months.reduce((bi, m, i) => m.sum > months[bi].sum ? i : bi, 0);
  $('plot').innerHTML = months.map((m, i) => `<div class="col" data-i="${i}" tabindex="0" role="button" aria-label="${m.label} ${m.year}: ${rp(m.sum)}"><div class="bar" style="height:${m.sum / max * 100}%"></div><span class="lb">${m.label}</span></div>`).join('');
  pick(chartSel);
}
function pick(i) {
  chartSel = i;
  document.querySelectorAll('#plot .tip').forEach(t => t.remove());
  document.querySelectorAll('#plot .col').forEach((c, k) => c.classList.toggle('on', k === i));
  const m = chartData[i], col = document.querySelectorAll('#plot .col')[i];
  if (!m || !col) return;
  const t = document.createElement('div'); t.className = 'tip';
  t.innerHTML = `<div class="h">${m.label} ${m.year}</div><div><span>Pendapatan</span><b>${rp(m.sum)}</b></div><div><span>Pesanan</span><b>${m.n}</b></div>`;
  col.appendChild(t);
}
$('plot').addEventListener('mouseover', e => { const c = e.target.closest('.col'); if (c) pick(+c.dataset.i); });
$('plot').addEventListener('click', e => { const c = e.target.closest('.col'); if (c) pick(+c.dataset.i); });
$('plot').addEventListener('focusin', e => { const c = e.target.closest('.col'); if (c) pick(+c.dataset.i); });

function renderB() {
  const f = $('fStatus').value, rows = bookings.filter(b => !f || b.status === f);
  $('tB').innerHTML = '<tr><th>Kode</th><th>Pelanggan</th><th>HP</th><th>Mobil</th><th>Tanggal</th><th>Sopir</th><th>Total</th><th>Status</th><th></th></tr>' +
    (rows.map(b => `<tr><td>${esc(b.code)}</td><td>${esc(b.customer_name)}</td><td><a href="https://wa.me/${encodeURIComponent(String(b.phone).replace(/^0/,'62').replace('+',''))}" target="_blank" rel="noopener">${esc(b.phone)}</a></td>
    <td>${esc(b.car)}</td><td>${esc(b.start_date)} s/d ${esc(b.end_date)}</td><td>${b.with_driver?'Ya':'Tidak'}</td><td>${rp(b.total_price)}</td>
    <td><select data-st="${b.id}">${Object.keys(ST).map(s => `<option value="${s}" ${s===b.status?'selected':''}>${ST[s]}</option>`).join('')}</select></td>
    <td><button class="danger" data-delb="${b.id}">Hapus</button></td></tr>`).join('') || '<tr><td colspan="9">Belum ada pesanan.</td></tr>');
  document.querySelectorAll('[data-st]').forEach(s => s.onchange = async () => { try { await api('/api/admin/bookings/' + s.dataset.st, 'PATCH', {status:s.value}); await load(); } catch (e) { alert(e.message); } });
  document.querySelectorAll('[data-delb]').forEach(b => b.onclick = async () => { if (confirm('Hapus pesanan ini permanen?')) { await api('/api/admin/bookings/' + b.dataset.delb, 'DELETE'); load(); } });
}
function renderC() {
  $('tC').innerHTML = '<tr><th>Nama</th><th>Kategori</th><th>Kursi</th><th>Harga/hari</th><th>Sopir</th><th>Status</th><th></th></tr>' +
    cars.map(c => `<tr><td>${esc(c.name)}</td><td>${esc(c.category)}</td><td>${esc(c.seats)}</td><td>${rp(c.price_per_day)}</td><td>${rp(c.driver_fee)}</td><td>${c.is_active?'Tampil':'Disembunyikan'}</td>
    <td><button data-edit="${c.id}">Ubah</button> <button data-tog="${c.id}">${c.is_active?'Sembunyikan':'Tampilkan'}</button> <button class="danger" data-delc="${c.id}">Hapus</button></td></tr>`).join('');
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => startEdit(+b.dataset.edit));
  document.querySelectorAll('[data-tog]').forEach(b => b.onclick = async () => { const c = cars.find(x => x.id == b.dataset.tog); await api('/api/admin/cars/' + c.id, 'PUT', {...c, is_active: !c.is_active}); load(); });
  document.querySelectorAll('[data-delc]').forEach(b => b.onclick = async () => { if (!confirm('Hapus mobil ini?')) return; const r = await api('/api/admin/cars/' + b.dataset.delc, 'DELETE'); if (r.note) alert(r.note); load(); });
}
const fields = {name:'cName',category:'cCat',seats:'cSeats',transmission:'cTrans',fuel:'cFuel',price_per_day:'cPrice',driver_fee:'cDriver',image_url:'cImg'};
function startEdit(id) {
  const c = cars.find(x => x.id === id); editId = id;
  for (const k in fields) $(fields[k]).value = c[k] ?? '';
  $('formTitle').textContent = 'Ubah mobil'; $('cancelEdit').classList.remove('hide'); scrollTo({top:0, behavior:'smooth'});
}
function clearForm() { editId = null; for (const k in fields) $(fields[k]).value = k === 'driver_fee' ? 1000000 : ''; $('formTitle').textContent = 'Tambah mobil'; $('cancelEdit').classList.add('hide'); }
$('cancelEdit').onclick = clearForm;
$('saveCar').onclick = async () => {
  const body = {}; for (const k in fields) body[k] = $(fields[k]).value;
  if (!body.name || !body.category || !body.seats || !body.price_per_day) return alert('Isi nama, kategori, kursi, dan harga.');
  try {
    if (editId) await api('/api/admin/cars/' + editId, 'PUT', {...body, is_active: cars.find(c => c.id === editId).is_active});
    else await api('/api/admin/cars', 'POST', body);
    clearForm(); load();
  } catch (e) { alert(e.message); }
};

$('loginBtn').onclick = () => { key = $('pw').value; enter(); };
$('pw').onkeydown = e => { if (e.key === 'Enter') $('loginBtn').click(); };
$('logout').onclick = () => { sessionStorage.removeItem('adminKey'); location.reload(); };
$('refresh').onclick = load;
$('fStatus').onchange = renderB;
$('tabB').onclick = () => { $('secB').classList.remove('hide'); $('secC').classList.add('hide'); $('tabB').setAttribute('aria-selected', true); $('tabC').setAttribute('aria-selected', false); };
$('tabC').onclick = () => { $('secC').classList.remove('hide'); $('secB').classList.add('hide'); $('tabC').setAttribute('aria-selected', true); $('tabB').setAttribute('aria-selected', false); };
if (key) enter();
</script>
</body>
</html>
